%YAML 1.1
---
# =============================================================================
# Project 2 — Scenario B: Suricata configuration for offline PCAP analysis.
#
# The pipeline runs Suricata as an ephemeral container with this file and the
# local rule set mounted read-only. It never sits inline in a forwarding path.
# =============================================================================

vars:
  address-groups:
    HOME_NET: "[10.20.10.0/24]"
    EXTERNAL_NET: "!$HOME_NET"
  port-groups:
    HTTP_PORTS: "3000"

default-rule-path: /rules
rule-files:
  - scenario-b-local.rules

classification-file: /etc/suricata/classification.config
reference-config-file: /etc/suricata/reference.config

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert
        - http
        - flow
  - fast:
      enabled: yes
      filename: fast.log
  - stats:
      enabled: yes
      filename: stats.log

logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: yes
    - file:
        enabled: yes
        filename: suricata.log
