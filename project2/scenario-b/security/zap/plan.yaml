# =============================================================================
# Scenario B — targeted ZAP SQL-injection plan (ZAP Automation Framework)
#
# Executed in phase 2B as:
#   zap.sh -cmd -autorun /zap/wrk/plan.yaml
#
# It is a persistent, versioned configuration: the plan proves what was asked,
# the JSON report proves what was detected. Alert 40018 is the positive control.
#
# ZAP 2.17 layout: `requests` and `policyDefinition` are job-level fields, not
# members of `parameters`. Nesting them under `parameters` makes ZAP warn
# "Unrecognised parameter" and the requestor/activeScan jobs do nothing.
# =============================================================================
env:
  contexts:
    - name: juice-shop
      urls:
        - http://10.20.10.20:3000
      includePaths:
        - http://10\.20\.10\.20:3000.*
  parameters:
    failOnError: true
    failOnWarning: false
    progressToStdout: true

jobs:
  - type: spider
    parameters:
      context: juice-shop
      url: http://10.20.10.20:3000
      maxDuration: 1
      maxDepth: 2

  - type: requestor
    requests:
      # Controlled login seed, as required by the brief.
      - url: http://10.20.10.20:3000/rest/user/login
        method: POST
        data: '{"email":"admin@juice-sh.op","password":"admin123"}'
        headers:
          - "Content-Type: application/json"
        responseCode: 200
      # Deterministic SQLi transaction, encoded quote/parenthesis. It also
      # seeds the endpoint in the sites tree for the active scan below.
      - url: "http://10.20.10.20:3000/rest/products/search?q=%27%28"
        method: GET
        responseCode: 500

  - type: activeScan
    parameters:
      context: juice-shop
      maxRuleDurationInMins: 2
      maxScanDurationInMins: 10
    policyDefinition:
      defaultStrength: Medium
      defaultThreshold: "Off"
      rules:
        - id: 40018
          name: SQL Injection
          strength: HIGH
          threshold: LOW

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk
      reportFile: zap-sqli.json
