# =============================================================================
# Project 2 — Scenario A gateway configuration (phase 1C)
#
#   :80  → 301 → https://<host><path>
#   :443 TLS 1.2/1.3 termination → app-net → Django 10.20.8.20:8000
#
# Django receives X-Forwarded-Proto: https so its security logic sees the
# original scheme after TLS terminates here.
# =============================================================================

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;
    server_name telecom-lab.local;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       10m;

    location / {
        proxy_pass         http://10.20.8.20:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
