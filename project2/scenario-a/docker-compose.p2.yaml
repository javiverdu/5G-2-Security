# =============================================================================
# Project 2 — Scenario A: application layer (phase 1B)
#
# Django is connected ONLY to app-net (10.20.8.0/24, internal). It never joins
# dn-net: the only way in is through the Nginx gateway added in phase 1C.
#
# Usage:
#   docker compose -f project2/scenario-a/docker-compose.p2.yaml up -d --build
#
# Secrets come from ./env, which is git-ignored (copy env.example).
# =============================================================================
name: scenario-a

services:
  django:
    build: ./django
    image: telecom-lab-django:0.1
    container_name: scenario-b-django
    restart: unless-stopped
    env_file:
      - ./env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "10.20.8.20,10.20.6.20,telecom-lab.local,localhost,127.0.0.1"
      DJANGO_DB_PATH: "/app/data/db.sqlite3"
      LAB_ADMIN_USER: "securityadmin"
      LAB_ADMIN_EMAIL: "securityadmin@telecom-lab.local"
    volumes:
      - django-data:/app/data
    networks:
      app-net:
        ipv4_address: 10.20.8.20

  nginx:
    build: ./nginx
    image: telecom-lab-nginx:p2
    container_name: scenario-b-nginx
    restart: unless-stopped
    depends_on:
      - django
    cap_add:
      - NET_ADMIN
    volumes:
      - ../../secrets/tls/server.crt:/etc/nginx/tls/server.crt:ro
      - ../../secrets/tls/server.key:/etc/nginx/tls/server.key:ro
    networks:
      dn-net:
        ipv4_address: 10.20.6.20
      app-net:
        ipv4_address: 10.20.8.10

networks:
  app-net:
    name: app-net
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.20.8.0/24

  dn-net:
    # Created by scenario-b/scripts/enable-n6.sh (N6/data network).
    external: true
    name: dn-net

volumes:
  django-data:
    name: django-data
