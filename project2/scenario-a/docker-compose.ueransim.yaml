# =============================================================================
# Project 2 — Scenario A, phase 1A
#
# Both RAN components use the pinned UERANSIM v3.3.0 image, so the gNB and the
# UE never drift apart in version. Apply with the corresponding base file:
#
#   docker compose -f nr-gnb.yaml -f docker-compose.ueransim.yaml up -d nr_gnb
#   docker compose -f nr-ue.yaml  -f docker-compose.ueransim.yaml up -d nr_ue
# =============================================================================
services:
  nr_gnb:
    image: telecom-lab-ueransim:3.3.0-p2

  nr_ue:
    image: telecom-lab-ueransim:3.3.0-p2
